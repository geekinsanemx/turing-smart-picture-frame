[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-smart-picture-frame"
dynamic = ["version"]
description = "Image slideshow with clock overlay for Turing Smart Screen USB displays"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "res/fonts/*/LICENSE.txt", "res/fonts/*/OFL.txt"]
requires-python = ">=3.9"
dependencies = [
    "pyserial~=3.5",
    "Pillow~=11.3.0",
    "numpy~=2.0.2; python_version < '3.10'",
    "numpy~=2.2.6; python_version == '3.10'",
    "numpy~=2.3.1; python_version > '3.10'",
]

[project.urls]
Upstream = "https://github.com/mathoudebine/turing-smart-screen-python"

[project.scripts]
turing-smart-picture-frame = "turing_smart_picture_frame:main"

[tool.setuptools]
py-modules = ["turing_smart_picture_frame"]

[tool.setuptools.packages.find]
include = ["library*", "res*"]
namespaces = true

[tool.setuptools.package-data]
res = ["fonts/*/*"]

[tool.setuptools.dynamic]
version = { attr = "turing_smart_picture_frame.__version__" }
